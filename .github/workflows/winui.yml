name: winui

# Builds the WinUI 3 app on real Windows (x64 and ARM64). WinUI cannot be built on Linux, so this is the only place it is compiled.
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths: ["src/Remotely.App/**", "src/Remotely.Core/**", "src/Remotely.HostCore/**", "src/Remotely.ViewerCore/**", "src/Remotely.Client/**", "src/Remotely.HostWindows/**", ".github/workflows/winui.yml"]

jobs:
  app:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, platform: x64 }
          - { os: windows-11-arm, rid: win-arm64, platform: ARM64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish the WinUI 3 app
        shell: pwsh
        run: |
          dotnet publish src/Remotely.App -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} -o out/app-${{ matrix.rid }}
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }
          Get-ChildItem out/app-${{ matrix.rid }} | Select-Object -First 15 | ForEach-Object { Write-Host $_.Name ($_.Length) }
          Write-Host "files: $((Get-ChildItem out/app-${{ matrix.rid }} -Recurse -File).Count)"
      - name: Self-test - share this PC, connect with the token, receive a frame
        shell: pwsh
        run: |
          $exe = "out/app-${{ matrix.rid }}/Remotely.exe"
          $p = Start-Process $exe -ArgumentList "--selftest","$PWD/selftest.txt" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "timed out" }
          if (Test-Path selftest.txt) { Get-Content selftest.txt } else { Write-Host "no result file" }
          if (-not (Test-Path selftest.txt) -or (Get-Content selftest.txt -TotalCount 1) -ne "PASS") { throw "self-test failed" }
      - name: Start the window and take a screenshot
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $p = Start-Process "out/app-${{ matrix.rid }}/Remotely.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "the app exited with code $($p.ExitCode)" }
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("$PWD/winui-home-${{ matrix.rid }}.png")
          $p.Kill()
      - uses: actions/upload-artifact@v4
        with:
          name: "Remotely.App-screenshot-${{ matrix.rid }}"
          path: "winui-home-${{ matrix.rid }}.png"
      - uses: actions/upload-artifact@v4
        with:
          name: "Remotely.App-${{ matrix.rid }}"
          path: "out/app-${{ matrix.rid }}"

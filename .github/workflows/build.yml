name: build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the installers as a draft release with this tag (for example v0.4.0). Leave empty for a normal build."
        type: string
        default: ""
  push:
    branches: [main, "claude/**"]
    # Documentation alone does not need the Windows machines.
    paths-ignore: ["docs/**", "**/*.md", "LICENSE", "mac/**", ".github/workflows/mac.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/Remotely.Tests -c Release
      - name: Publish
        run: |
          set -e
          for rid in win-arm64 win-x64; do
            dotnet publish src/Remotely.Host   -c Release -r $rid --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out/host-$rid
            dotnet publish src/Remotely.Probe  -c Release -r $rid --self-contained -p:PublishSingleFile=true -p:DebugType=none -o out/probe-$rid
          done
          dotnet publish src/Remotely.Probe  -c Release -r osx-x64 --self-contained -p:PublishSingleFile=true -p:DebugType=none -o out/probe-osx-x64
          dotnet publish src/Remotely.Server -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:DebugType=none -o out/server-win-x64
      - uses: actions/upload-artifact@v4
        with: { name: Remotely.Host-win-arm64, path: out/host-win-arm64/Remotely.Host.exe }
      - uses: actions/upload-artifact@v4
        with: { name: Remotely.Host-win-x64, path: out/host-win-x64/Remotely.Host.exe }
      - uses: actions/upload-artifact@v4
        with: { name: Remotely.Server-win-x64, path: "out/server-win-x64/Remotely.Server.exe\nout/server-win-x64/appsettings.json" }
      - uses: actions/upload-artifact@v4
        with: { name: Remotely.Probe-win-arm64, path: out/probe-win-arm64/Remotely.Probe.exe }
      - uses: actions/upload-artifact@v4
        with: { name: Remotely.Probe-win-x64, path: out/probe-win-x64/Remotely.Probe.exe }
      - uses: actions/upload-artifact@v4
        with: { name: Remotely.Probe-osx-x64, path: out/probe-osx-x64/Remotely.Probe }

  # The WinUI 3 app cannot be built on Linux. Builds it on real Windows (x64 and ARM64), runs its same-network self-test (share, connect with the token,
  # receive a screen frame, a used token is refused), starts the window and takes a screenshot.
  app:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, platform: x64 }
          - { os: windows-11-arm, rid: win-arm64, platform: ARM64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish the WinUI 3 app
        shell: pwsh
        run: |
          dotnet publish src/Remotely.App -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} -p:Version=0.4.0 -o out/app-${{ matrix.rid }}
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }
          Write-Host "files: $((Get-ChildItem out/app-${{ matrix.rid }} -Recurse -File).Count)"
      - name: Publish the Server Manager (WinUI 3)
        shell: pwsh
        run: |
          dotnet publish src/Remotely.ServerManager -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} -p:Version=0.4.0 -o out/manager-${{ matrix.rid }}
          if ($LASTEXITCODE -ne 0) { throw "server manager publish failed" }
          $m = Start-Process "out/manager-${{ matrix.rid }}/Remotely.ServerManager.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($m.HasExited) { throw "the Server Manager exited with code $($m.ExitCode)" }
          $m.Kill()
      - name: Self-test - share this PC, connect with the token, receive a frame
        shell: pwsh
        run: |
          $exe = "out/app-${{ matrix.rid }}/Remotely.exe"
          $p = Start-Process $exe -ArgumentList "--selftest","$PWD/selftest.txt" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "timed out" }
          if (Test-Path selftest.txt) { Get-Content selftest.txt } else { Write-Host "no result file" }
          if (-not (Test-Path selftest.txt) -or (Get-Content selftest.txt -TotalCount 1) -ne "PASS") { throw "self-test failed" }
      - name: Start the window and take a screenshot
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $p = Start-Process "out/app-${{ matrix.rid }}/Remotely.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "the app exited with code $($p.ExitCode)" }
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("$PWD/winui-home-${{ matrix.rid }}.png")
          $p.Kill()
      - name: Open every listed page and take a screenshot of each
        shell: pwsh
        run: ./tools/ci/show-pages.ps1 -Exe "out/app-${{ matrix.rid }}/Remotely.exe" -List tools/ci/pages.txt -Out "pages-${{ matrix.rid }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "Remotely.App-pages-${{ matrix.rid }}"
          path: "pages-${{ matrix.rid }}"
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: "Remotely.App-screenshot-${{ matrix.rid }}"
          path: "winui-home-${{ matrix.rid }}.png"
      - uses: actions/upload-artifact@v4
        with:
          name: "Remotely.App-${{ matrix.rid }}"
          path: "out/app-${{ matrix.rid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: "Remotely.ServerManager-${{ matrix.rid }}"
          path: "out/manager-${{ matrix.rid }}"

  # Runs the real chain on real Windows machines (x64 and ARM64): server, pairing, service install, helper launch, frame through the relay.
  # GitHub's runners are headless, so this proves the plumbing, not what a person sees on a real screen.
  smoke:
    needs: [build, app]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: "Remotely.Host-${{ matrix.rid }}", path: host }
      - uses: actions/download-artifact@v4
        with: { name: "Remotely.Probe-${{ matrix.rid }}", path: probe }
      - uses: actions/download-artifact@v4
        with: { name: Remotely.Server-win-x64, path: server }
      - uses: actions/download-artifact@v4
        with: { name: "Remotely.App-${{ matrix.rid }}", path: app }
      - name: End to end
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Continue'
          $script:fail = 0
          function Check($name, $ok) { if ($ok) { Write-Host "CHECK PASS: $name" } else { Write-Host "CHECK FAIL: $name"; $script:fail++ } }
          function Observe($text) { Write-Host "OBSERVE: $text" }
          $hostExe = "$PWD\host\Remotely.Host.exe"; $probe = "$PWD\probe\Remotely.Probe.exe"
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class Cur { [StructLayout(LayoutKind.Sequential)] public struct P { public int X; public int Y; } [DllImport("user32.dll")] public static extern bool GetCursorPos(out P p); }'
          function Cursor { $p = New-Object Cur+P; [void][Cur]::GetCursorPos([ref]$p); return $p }
          function NewCode { (Invoke-RestMethod -Method Post http://127.0.0.1:8181/admin/pair-codes).code }
          function WaitOnline($name) {
            for ($i = 0; $i -lt 40; $i++) { $l = (& $probe list 2>&1) -join "`n"; if ($l -match "online\s+host\s+$name\s") { return $true }; Start-Sleep 1 }
            return $false
          }

          Write-Host "== diag (as runner user)"; & $hostExe diag "$PWD\diag-user.jpg"
          $env:Remotely__TlsEnabled = 'false'; $env:Remotely__DataDir = "$env:RUNNER_TEMP\srvdata"
          $null = Start-Process "$PWD\server\Remotely.Server.exe" -PassThru -RedirectStandardOutput "$PWD\server.out" -RedirectStandardError "$PWD\server.err"
          Start-Sleep 8
          $o = & $probe pair --server ws://127.0.0.1:8443/ws --code (NewCode) --name ci-viewer --insecure 2>&1; $o
          $viewerId = [regex]::Match(($o -join "`n"), '[0-9a-f]{64}').Value
          Check "viewer paired" ($viewerId.Length -eq 64)
          $inviteOut = (& "$PWD\server\Remotely.Server.exe" invite --address 127.0.0.1:8443 2>&1) -join "`n"; Write-Host $inviteOut
          $inv = [regex]::Match($inviteOut, 'RMT1-\S+').Value
          Check "the server prints an invite" ($inv.Length -gt 60)
          $payload = New-Object byte[] 2000000; (New-Object Random).NextBytes($payload)
          [IO.File]::WriteAllBytes("$PWD\upload.bin", $payload)
          $uploadHash = (Get-FileHash "$PWD\upload.bin").Hash

          # ---------- USER MODE (no service, no administrator needed) ----------
          Write-Host "`n===== USER MODE ====="
          $o = & $hostExe setup --user --server ws://127.0.0.1:8443/ws --insecure --code (NewCode) --name ci-user-host --trust $viewerId 2>&1; $o
          & $hostExe install --user
          Check "user-mode host online" (WaitOnline 'ci-user-host')
          $userHostId = ([regex]::Match(((& $probe list 2>&1) -join "`n"), 'ci-user-host\s+([0-9a-f]{64})')).Groups[1].Value
          $o = & $probe watch $userHostId --out "$PWD\frames-user" --count 1 --seconds 10 2>&1; $o
          Check "user mode: frame received from the Default desktop" (($o -join "`n") -match 'desktop=Default')
          & $probe control $userHostId --move 16384,16384 --wait 2 2>&1
          $c = Cursor; Observe "user mode cursor after move to 16384,16384: $($c.X),$($c.Y)"
          Check "user mode: mouse moved to about a quarter of the screen" ([math]::Abs($c.X - 256) -le 3 -and [math]::Abs($c.Y - 192) -le 3)
          & $probe control $userHostId --clip "user-mode-clip" --wait 2 2>&1
          Check "user mode: clipboard written" ((Get-Clipboard -Raw) -eq 'user-mode-clip')
          $o = & $probe control $userHostId --upload "$PWD\upload.bin" --wait 1 2>&1; $o
          $rcv = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Remotely\Received\upload.bin'
          Check "user mode: uploaded file identical" ((Test-Path $rcv) -and ((Get-FileHash $rcv).Hash -eq $uploadHash))
          $o = & $probe control $userHostId --sas --wait 1 2>&1; $o
          Check "user mode: does not claim Ctrl+Alt+Del" (($o -join "`n") -match 'Ctrl\+Alt\+Del available: False')
          Get-Content "$env:LOCALAPPDATA\Remotely\logs\*.log" -ErrorAction SilentlyContinue | Select-Object -Last 12
          & $hostExe uninstall --user
          Start-Sleep 2

          # ---------- SERVICE MODE ----------
          Write-Host "`n===== SERVICE MODE ====="
          # Service mode joins with the invite alone: no pin, no code, no list of viewer ids (family mode trusts every device paired with the server).
          $o = & $hostExe setup --invite $inv --name ci-host 2>&1; $o
          Check "setup --invite turns family trust on" (($o -join "`n") -match 'Any device paired with your server may connect: yes')
          & $hostExe install
          for ($i = 0; $i -lt 20 -and -not ((sc.exe query Remotely.Host) -match 'RUNNING'); $i++) { Start-Sleep 1 }
          Check "service running" ((sc.exe query Remotely.Host) -match 'RUNNING')
          Check "service host online" (WaitOnline 'ci-host')
          $hostId = ([regex]::Match(((& $probe list 2>&1) -join "`n"), 'ci-host\s+([0-9a-f]{64})')).Groups[1].Value
          Get-Content "C:\ProgramData\Remotely\logs\*.log" -ErrorAction SilentlyContinue
          $o = & $probe watch $hostId --out "$PWD\frames" --count 1 --seconds 10 2>&1; $o
          Check "service: frame received from the Default desktop" (($o -join "`n") -match 'desktop=Default')
          & $probe control $hostId --move 49152,49152 --wait 2 2>&1
          $c = Cursor; Observe "service cursor after move to 49152,49152: $($c.X),$($c.Y)"
          Check "service: mouse moved to about three quarters of the screen" ([math]::Abs($c.X - 768) -le 3 -and [math]::Abs($c.Y - 576) -le 3)
          & $probe control $hostId --clip "service-clip" --wait 2 2>&1
          Check "service: clipboard written" ((Get-Clipboard -Raw) -eq 'service-clip')
          $o = & $probe control $hostId --upload "$PWD\upload.bin" --wait 1 2>&1; $o
          $rcv = 'C:\Users\Public\Documents\Remotely\Received\upload.bin'
          Check "service: uploaded file identical" ((Test-Path $rcv) -and ((Get-FileHash $rcv).Hash -eq $uploadHash))
          New-Item -ItemType Directory -Force 'C:\Users\Public\Documents\Remotely\Share' | Out-Null
          Copy-Item "$PWD\upload.bin" 'C:\Users\Public\Documents\Remotely\Share\shared.bin'
          $o = & $probe control $hostId --list-share --download shared.bin --wait 1 2>&1; $o
          Check "service: shared file downloaded identical" ((Test-Path "$PWD\downloads\shared.bin") -and ((Get-FileHash "$PWD\downloads\shared.bin").Hash -eq $uploadHash))
          $o = & $probe control $hostId --download "..\..\Windows\win.ini" --wait 1 2>&1; $o
          Check "service: path traversal refused" (($o -join "`n") -match 'download failed')

          # ---------- THE APP (WinUI 3): first run, joining from the invite, the server path ----------
          Write-Host "`n===== APP UI (server path) ====="
          $appExe = "$PWD\app\Remotely.exe"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size); $g.Dispose()
            $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
            $ep = New-Object System.Drawing.Imaging.EncoderParameters 1
            $ep.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter -ArgumentList @([System.Drawing.Imaging.Encoder]::Quality, [long]65)
            $bmp.Save("$PWD\$name.jpg", $codec, $ep); $bmp.Dispose()
          }
          $v = Start-Process $appExe -PassThru; Start-Sleep 8
          Check "the app starts and stays running on first run" (-not $v.HasExited)
          if ($v.HasExited) {
            Write-Host "app exit code: $($v.ExitCode)"
            Get-Content "$env:LOCALAPPDATA\Remotely\logs\app-crash.log" -ErrorAction SilentlyContinue | Select-Object -First 40
          }
          Shot 'ui-home'; Stop-Process $v -Force -ErrorAction SilentlyContinue
          $uiDir = "$env:LOCALAPPDATA\Remotely"; New-Item -ItemType Directory $uiDir -Force | Out-Null
          '{"DeviceName":"ci-ui-viewer","Theme":"dark","SyncClipboard":true}' | Set-Content "$uiDir\viewer.json"
          # The first-run path: no server configured, started with the invite (what the installer does). The app joins and shows My computers.
          $v = Start-Process $appExe -ArgumentList '--invite', $inv -PassThru; Start-Sleep 10
          Check "the app stays running while joining from the invite" (-not $v.HasExited)
          Shot 'ui-computers'; Stop-Process $v -Force -ErrorAction SilentlyContinue
          $uiId = (Get-Content "$uiDir\device-id.txt" -ErrorAction SilentlyContinue)
          Check "the app wrote its device id and paired with the server" (($uiId -match '^[0-9a-f]{64}$') -and (((& $probe list 2>&1) -join "`n") -match 'ci-ui-viewer'))
          # The server path through the app's own code: device list, session to the service host, a frame, input.
          $t = Start-Process $appExe -ArgumentList '--selftest-server', "$PWD\selftest-server.txt", $hostId -PassThru
          if (-not $t.WaitForExit(120000)) { $t.Kill(); Write-Host "server self-test timed out" }
          if (Test-Path "$PWD\selftest-server.txt") { Get-Content "$PWD\selftest-server.txt" }
          Check "app server path: list, connect, frame and input through the server" ((Test-Path "$PWD\selftest-server.txt") -and ((Get-Content "$PWD\selftest-server.txt" -TotalCount 1) -eq 'PASS'))
          Check "the service host saw the app connect" ($null -ne (Get-Content "C:\ProgramData\Remotely\logs\*.log" | Select-String "Viewer $($uiId.Substring(0,4))-$($uiId.Substring(4,4))"))

          # ---------- THE LOCK SCREEN ----------
          Write-Host "`n===== LOCK SCREEN ====="
          Start-Process rundll32.exe -ArgumentList 'user32.dll,LockWorkStation'
          for ($i = 0; $i -lt 40 -and -not (Get-Process LogonUI -ErrorAction SilentlyContinue); $i++) { Start-Sleep 1 }
          Observe "LogonUI process present after $i s: $([bool](Get-Process LogonUI -ErrorAction SilentlyContinue))"
          Start-Sleep 3
          $o = & $probe watch $hostId --out "$PWD\frames-lock" --count 2 --seconds 12 2>&1; $o
          # On the headless x64 runner Windows switches to the lock screen straight away. On the headless ARM64 runner the lock UI starts but the input desktop
          # stays "Default" until Ctrl+Alt+Del, so there it is reported, not required (the secure desktop itself is required below, on both).
          if ($env:RID -eq 'win-x64') { Check "lock screen: captured as the Winlogon desktop" (($o -join "`n") -match 'desktop=Winlogon') }
          else { Observe "lock screen capture on $env:RID: $(if (($o -join "`n") -match 'desktop=Winlogon') { 'Winlogon' } else { 'still the Default desktop on this runner' })" }
          Observe "lock screen capture lines above: desktop=Winlogon means the lock screen was captured"
          Check "lock screen: host still answers while locked" (($o -join "`n") -match 'desktop=')
          if (($o -join "`n") -match 'desktop=Winlogon') { Observe "LOCK SCREEN CAPTURED (desktop=Winlogon)" } else { Observe "lock screen NOT reported as Winlogon" }
          & $hostExe enable-sas
          $o = & $probe control $hostId --sas --wait 3 2>&1; $o
          Observe "Ctrl+Alt+Del request sent; see host log for any error"
          Start-Sleep 2
          Write-Host "== host log"; Get-Content "C:\ProgramData\Remotely\logs\*.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
          $o = & $probe watch $hostId --out "$PWD\frames-sas" --count 1 --seconds 10 2>&1; $o
          Check "secure desktop (after Ctrl+Alt+Del) captured as Winlogon" (($o -join "`n") -match 'desktop=Winlogon')
          & $hostExe uninstall
          Write-Host "`nFAILED CHECKS: $script:fail"
          if ($env:RID -eq 'win-x64') {
            foreach ($f in 'ui-home', 'ui-computers') {
              $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD\$f.jpg"))
              Write-Host "BEGIN-IMG $f"
              for ($i = 0; $i -lt $b64.Length; $i += 3000) { Write-Host $b64.Substring($i, [Math]::Min(3000, $b64.Length - $i)) }
              Write-Host "END-IMG $f"
            }
          }
          if ($script:fail -gt 0) { exit 1 } else { exit 0 }   # without this the exit code of the last native command (sc.exe query on a removed service = 1060) leaks out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.rid }}
          path: |
            frames
            frames-user
            frames-lock
            frames-sas
            ui-*.jpg
            selftest-server.txt
            diag-user.jpg
            server.out
            server.err
          if-no-files-found: ignore

  # Compiles the three installers with Inno Setup on Windows.
  installers:
    needs: [build, app]
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: Remotely.App-win-x64, path: publish/x64/app }
      - uses: actions/download-artifact@v4
        with: { name: Remotely.Host-win-x64, path: publish/x64/host }
      - uses: actions/download-artifact@v4
        with: { name: Remotely.App-win-arm64, path: publish/arm64/app }
      - uses: actions/download-artifact@v4
        with: { name: Remotely.Host-win-arm64, path: publish/arm64/host }
      - uses: actions/download-artifact@v4
        with: { name: Remotely.Server-win-x64, path: publish/server }
      - uses: actions/download-artifact@v4
        with: { name: Remotely.ServerManager-win-x64, path: publish/manager }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Compile installers
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          Write-Host "Using $iscc"
          foreach ($arch in "x64", "arm64") { & $iscc "/DArch=$arch" "/DVersion=0.4.0" installer\Remotely.iss; if ($LASTEXITCODE -ne 0) { throw "client installer $arch failed" } }
          & $iscc "/DVersion=0.4.0" installer\Remotely-Server.iss; if ($LASTEXITCODE -ne 0) { throw "server installer failed" }
          Get-ChildItem publish\*.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
      # SHA256SUMS.txt is what the update check in the apps reads before it offers a download; the release must carry it next to the installers.
      - name: SHA-256 checksums of the installers
        shell: pwsh
        run: ./build/checksums.ps1 -Dir publish
      - name: The winget and scoop manifests can be filled in from the checksums
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'packaging'
          Copy-Item packaging $tmp -Recurse
          ./build/update-manifests.ps1 -Version 0.4.0 -SumsFile publish/SHA256SUMS.txt -Packaging $tmp
          $files = Get-ChildItem $tmp -Recurse -File
          $left = $files | Select-String -SimpleMatch 'REPLACE_WITH'
          if ($left) { throw "placeholders left after update-manifests.ps1: $($left | Out-String)" }
          $null = Get-Content (Join-Path $tmp 'scoop\remotely.json') -Raw | ConvertFrom-Json
          foreach ($line in Get-Content publish/SHA256SUMS.txt) {
            $hash, $name = $line -split '\s+', 2
            $hits = $files | Select-String -SimpleMatch $hash
            if (-not $hits) { throw "the hash of $name is in no manifest" }
            Write-Host "manifest holds the hash of ${name}: $(($hits | ForEach-Object { $_.Path | Split-Path -Leaf } | Sort-Object -Unique) -join ', ')"
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Runs the update pipeline on Windows: the real PowerShell Authenticode check (unsigned, signed, tampered) and the real installers through a local test feed
      # (the check, the download, the SHA-256 comparison, a tampered copy refused).
      - name: Update pipeline test with the real installers
        shell: pwsh
        env:
          REMOTELY_PUBLISH_DIR: ${{ github.workspace }}\publish
          REMOTELY_VERSION: "0.4.0"
        run: |
          dotnet test tests/Remotely.Tests -c Release --filter "FullyQualifiedName~Update" --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "update tests failed" }
      - uses: actions/upload-artifact@v4
        with: { name: Installer-sha256, path: publish/SHA256SUMS.txt }
      - uses: actions/upload-artifact@v4
        with: { name: Installer-x64, path: publish/Remotely-Setup-0.4.0-x64.exe }
      - uses: actions/upload-artifact@v4
        with: { name: Installer-arm64, path: publish/Remotely-Setup-0.4.0-arm64.exe }
      - uses: actions/upload-artifact@v4
        with: { name: Installer-server, path: publish/Remotely-Server-Setup-0.4.0-x64.exe }

  # Runs the real installers silently on real Windows (x64 and ARM64): server installer, then client installer for all users, then for the current user,
  # over real TLS with the server key pin.
  installer-smoke:
    needs: installers
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, arch: x64 }
          - { os: windows-11-arm, rid: win-arm64, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: "Installer-${{ matrix.arch }}", path: inst }
      - uses: actions/download-artifact@v4
        with: { name: Installer-server, path: inst }
      - uses: actions/download-artifact@v4
        with: { name: "Remotely.Probe-${{ matrix.rid }}", path: probe }
      - name: Install and test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $script:fail = 0
          function Check($name, $ok) { if ($ok) { Write-Host "CHECK PASS: $name" } else { Write-Host "CHECK FAIL: $name"; $script:fail++ } }
          function WaitFor($what, [scriptblock]$test, $seconds = 40) { for ($i = 0; $i -lt $seconds; $i++) { if (& $test) { return $true }; Start-Sleep 1 }; return $false }
          $probe = "$PWD\probe\Remotely.Probe.exe"
          $serverExe = "C:\Program Files\Remotely Server\Remotely.Server.exe"
          $silent = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          # Start-Process -Wait also waits for descendants, and a per-user install deliberately leaves a long-running host behind: wait for the process itself.
          function RunWait($file, $argList, $timeoutSec = 300) {
            $p = Start-Process $file -ArgumentList $argList -PassThru
            if (-not $p.WaitForExit($timeoutSec * 1000)) { Write-Host "TIMEOUT waiting for $file"; try { $p.Kill() } catch {} }
            return $p
          }
          # Upgrade tests start from the installers of the last published release (v0.2.0), downloaded from GitHub and compared with the SHA-256 GitHub shows for the asset.
          function GetRelease($name) {
            $ProgressPreference = 'SilentlyContinue'
            try {
              $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'remotely-ci'; Accept = 'application/vnd.github+json' }
              $rel = Invoke-RestMethod 'https://api.github.com/repos/burim13/Remotely/releases/tags/v0.2.0' -Headers $headers
              $asset = $rel.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
              New-Item -ItemType Directory -Force old | Out-Null
              $file = Join-Path "$PWD\old" $name
              Invoke-WebRequest $asset.browser_download_url -OutFile $file -UseBasicParsing
              $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host "downloaded $name ($((Get-Item $file).Length) bytes), sha256 $actual, GitHub shows $($asset.digest)"
              Check "v0.2.0 asset $name matches the SHA-256 GitHub shows for it" ($asset.digest -eq "sha256:$actual")
              return $file
            } catch { Write-Host "could not get ${name}: $_"; Check "v0.2.0 asset $name could be downloaded" $false; return $null }
          }
          function Snap($dir) { $m = @{}; Get-ChildItem $dir -Recurse -File -Force | ForEach-Object { $m[$_.FullName.Substring($dir.Length)] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash }; return $m }
          function SameSnap($a, $b) { if ($a.Count -ne $b.Count) { return $false }; foreach ($k in $a.Keys) { if ($b[$k] -ne $a[$k]) { return $false } }; return $true }
          function ArpVersion($guid) { (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{$guid}_is1" -ErrorAction SilentlyContinue).DisplayVersion }
          $clientGuid = 'A979AC82-5CEB-4AFD-9C80-A0AC7E51F7E0'
          $serverGuid = '4AD4465B-1297-47FA-96EB-767F6966DD9D'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'

          Write-Host "===== SERVER INSTALLER ====="
          $p = RunWait "$PWD\inst\Remotely-Server-Setup-0.4.0-x64.exe" ($silent + '/LOG=server-install.log' + '/Address=127.0.0.1')
          Check "server installer exit code 0" ($p.ExitCode -eq 0)
          Check "server service running" (WaitFor 'server' { (sc.exe query Remotely.Server) -match 'RUNNING' } 30)
          Check "the Server Manager was installed beside the server" (Test-Path 'C:\Program Files\Remotely Server\Manager\Remotely.ServerManager.exe')
          Check "the Server Manager's runtime files were installed with it" ((Get-ChildItem 'C:\Program Files\Remotely Server\Manager' -Recurse -File).Count -gt 50)
          Check "Start menu entry for the Server Manager exists" (Test-Path 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Remotely Server\Remotely Server Manager.lnk')
          $mgr = Start-Process 'C:\Program Files\Remotely Server\Manager\Remotely.ServerManager.exe' -PassThru
          Start-Sleep -Seconds 8
          Check "the installed Server Manager starts and stays running (process alive; this does not show that it renders)" (-not $mgr.HasExited)
          if (-not $mgr.HasExited) { $mgr.Kill() }
          Check "firewall rule added" ((netsh advfirewall firewall show rule name="Remotely Server") -match 'Remotely Server')
          $pin = ((& $serverExe pin) | Select-Object -Last 1).Trim()
          Check "server key pin printed (64 hex)" ($pin -match '^[0-9a-f]{64}$')
          function NewCode { for ($i = 0; $i -lt 20; $i++) { $c = (& $serverExe pair-code 2>$null | Select-Object -First 1); if ($c -match '^[A-Z0-9]{4}-[A-Z0-9]{4}$') { return $c }; Start-Sleep 1 } }
          $server = 'wss://127.0.0.1:8443/ws'
          $inviteOut = (& $serverExe invite 2>&1) -join "`n"; Write-Host $inviteOut
          $inv = [regex]::Match($inviteOut, 'RMT1-\S+').Value
          Check "the server prints an invite for the address given to the installer" ($inv.Length -gt 60 -and $inviteOut -match 'wss://127\.0\.0\.1:8443/ws')
          $o = & $probe pair --invite $inv --name inst-viewer 2>&1; $o
          $viewerId = [regex]::Match(($o -join "`n"), '[0-9a-f]{64}').Value
          Check "viewer paired from the invite over TLS with the pinned key" ($viewerId.Length -eq 64)
          $wrong = & $probe pair --server $server --pin ('0' * 64) --code (NewCode) --name evil 2>&1
          Check "a wrong key pin is refused" (($wrong -join "`n") -match 'Error')

          Write-Host "`n===== CLIENT INSTALLER: ALL USERS (service) ====="
          $args1 = $silent + @('/LOG=client-install.log', "/Invite=$inv", '/Name=inst-host')   # the invite alone: no pin, no code, no viewer ids
          $p = RunWait (Get-ChildItem "$PWD\inst\Remotely-Setup-*.exe").FullName $args1
          Check "client installer exit code 0" ($p.ExitCode -eq 0)
          Check "viewer installed" (Test-Path 'C:\Program Files\Remotely\Remotely.exe')
          Check "host installed" (Test-Path 'C:\Program Files\Remotely\Remotely.Host.exe')
          Check "the app's runtime files were installed with it" ((Get-ChildItem 'C:\Program Files\Remotely' -Recurse -File).Count -gt 50)
          Check "firewall rules for same-network sharing added" (((netsh advfirewall firewall show rule name="Remotely same-network (TCP)") -match '47810') -and ((netsh advfirewall firewall show rule name="Remotely same-network (UDP)") -match '47811'))
          # The installed app, on the installed machine: share this PC, connect with the token, receive a frame.
          $lan = Start-Process 'C:\Program Files\Remotely\Remotely.exe' -ArgumentList '--selftest', "$PWD\lan-selftest.txt" -PassThru
          if (-not $lan.WaitForExit(120000)) { $lan.Kill(); Write-Host "same-network self-test timed out" }
          if (Test-Path "$PWD\lan-selftest.txt") { Get-Content "$PWD\lan-selftest.txt" }
          Check "installed app: same-network token connection works" ((Test-Path "$PWD\lan-selftest.txt") -and ((Get-Content "$PWD\lan-selftest.txt" -TotalCount 1) -eq 'PASS'))
          Check "host service running" (WaitFor 'svc' { (sc.exe query Remotely.Host) -match 'RUNNING' } 30)
          Check "host online" (WaitFor 'online' { ((& $probe list 2>&1) -join "`n") -match 'online\s+host\s+inst-host\s' } 40)
          $hostId = ([regex]::Match(((& $probe list 2>&1) -join "`n"), 'inst-host\s+([0-9a-f]{64})')).Groups[1].Value
          $o = & $probe watch $hostId --out "$PWD\frames-service" --count 1 --seconds 15 2>&1; $o
          Check "frame received from the installed service" (($o -join "`n") -match 'desktop=')
          Check "start menu entry exists" (Test-Path 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Remotely\Remotely.lnk')
          $o = & "C:\Program Files\Remotely\Remotely.Host.exe" diag 2>&1; $o | Select-Object -First 12
          $null = RunWait 'C:\Program Files\Remotely\unins000.exe' ($silent + '/LOG=client-uninstall.log')
          Check "uninstall removed the service" (WaitFor 'gone' { (sc.exe query Remotely.Host) -match '1060' } 20)
          Check "uninstall removed the program files" (-not (Test-Path 'C:\Program Files\Remotely\Remotely.Host.exe'))
          Check "uninstall removed the firewall rules" (-not ((netsh advfirewall firewall show rule name="Remotely same-network (TCP)") -match 'Rule Name'))
          Check "uninstall kept the user's data" (Test-Path 'C:\ProgramData\Remotely\host.json')

          Write-Host "`n===== CLIENT UPGRADE: the v0.2.0 release installer, then this build ====="
          $newClient = (Get-ChildItem "$PWD\inst\Remotely-Setup-*.exe").FullName
          $arch = '${{ matrix.arch }}'
          $dataDir = 'C:\ProgramData\Remotely'
          if (Test-Path $dataDir) { Remove-Item $dataDir -Recurse -Force }
          $appDir = Join-Path $env:LOCALAPPDATA 'Remotely'
          New-Item -ItemType Directory -Force $appDir | Out-Null
          Set-Content "$appDir\address-book-canary.json" '{"canary":"a saved PC that must survive an upgrade"}'
          $canary = (Get-FileHash "$appDir\address-book-canary.json").Hash
          $oldClient = GetRelease "Remotely-Setup-0.2.0-$arch.exe"
          if ($oldClient) {
            $p = RunWait $oldClient ($silent + @('/LOG=client-old-install.log', "/Server=$server", "/Pin=$pin", "/Code=$(NewCode)", '/Name=upg-host', "/Trust=$viewerId"))
            Check "v0.2.0 installer exit code 0" ($p.ExitCode -eq 0)
            Check "v0.2.0 is registered as version 0.2.0 in Apps and features" ((ArpVersion $clientGuid) -eq '0.2.0')
            Check "v0.2.0 host service running" (WaitFor 'oldsvc' { (sc.exe query Remotely.Host) -match 'RUNNING' } 30)
            $oldOnline = WaitFor 'oldonline' { ((& $probe list 2>&1) -join "`n") -match 'online\s+host\s+upg-host\s' } 40
            Write-Host "INFO: the v0.2.0 host is $(if ($oldOnline) { 'online' } else { 'NOT online' }) on this server"
            $oldId = ([regex]::Match(((& $probe list 2>&1) -join "`n"), 'upg-host\s+([0-9a-f]{64})')).Groups[1].Value
            $keyBefore = (Get-FileHash "$dataDir\host.key").Hash
            $before = Snap 'C:\Program Files\Remotely'
            Write-Host "v0.2.0 program folder: $($before.Count) files"

            Write-Host "--- failing upgrade (/SimulateFailure=1): must roll back"
            $p = RunWait $newClient ($silent + @('/LOG=client-rollback.log', '/SimulateFailure=1'))
            Write-Host "failing installer exit code: $($p.ExitCode)"
            Check "a failing upgrade reports failure (non-zero exit code)" ($p.ExitCode -ne 0)
            $after = Snap 'C:\Program Files\Remotely'
            Check "rollback: every program file is exactly the v0.2.0 file again ($($after.Count) vs $($before.Count) files)" (SameSnap $before $after)
            Check "rollback: Apps and features still says 0.2.0" ((ArpVersion $clientGuid) -eq '0.2.0')
            Check "rollback: the host service is running again" (WaitFor 'rbsvc' { (sc.exe query Remotely.Host) -match 'RUNNING' } 40)
            Check "rollback: the device key is untouched" ((Get-FileHash "$dataDir\host.key").Hash -eq $keyBefore)
            Check "rollback: the address book canary is untouched" ((Get-FileHash "$appDir\address-book-canary.json").Hash -eq $canary)
            if ($oldOnline) { Check "rollback: the old host is online again" (WaitFor 'rbon' { ((& $probe list 2>&1) -join "`n") -match 'online\s+host\s+upg-host\s' } 60) }

            Write-Host "--- upgrade with no parameters at all (no questions)"
            $p = RunWait $newClient ($silent + '/LOG=client-upgrade.log')
            Check "upgrade installer exit code 0" ($p.ExitCode -eq 0)
            Check "upgrade: Apps and features says 0.4.0" ((ArpVersion $clientGuid) -eq '0.4.0')
            Check "upgrade: the app's runtime files are there" ((Get-ChildItem 'C:\Program Files\Remotely' -Recurse -File).Count -gt 50)
            Check "upgrade: the host program was replaced" ((Get-FileHash 'C:\Program Files\Remotely\Remotely.Host.exe').Hash -ne $before['\Remotely.Host.exe'])
            Check "upgrade: the host service is running (kept and restarted)" (WaitFor 'upsvc' { (sc.exe query Remotely.Host) -match 'RUNNING' } 40)
            Check "upgrade: the host is online again under the same name" (WaitFor 'uponline' { ((& $probe list 2>&1) -join "`n") -match 'online\s+host\s+upg-host\s' } 60)
            $newId = ([regex]::Match(((& $probe list 2>&1) -join "`n"), 'upg-host\s+([0-9a-f]{64})')).Groups[1].Value
            if ($oldId) { Check "upgrade: the device id did not change" ($newId -eq $oldId) }
            Check "upgrade: the device key is untouched" ((Get-FileHash "$dataDir\host.key").Hash -eq $keyBefore)
            Check "upgrade: the address book canary is untouched" ((Get-FileHash "$appDir\address-book-canary.json").Hash -eq $canary)
            Check "upgrade: firewall rules are in place" (((netsh advfirewall firewall show rule name="Remotely same-network (TCP)") -match '47810') -and ((netsh advfirewall firewall show rule name="Remotely same-network (UDP)") -match '47811'))
            Check "upgrade: Start menu entry exists" (Test-Path 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Remotely\Remotely.lnk')
            Check "upgrade without the start-with-Windows task writes no startup entry" ($null -eq (Get-ItemProperty $runKey -Name 'Remotely' -ErrorAction SilentlyContinue))

            Write-Host "--- start with Windows (task)"
            $p = RunWait $newClient ($silent + @('/LOG=client-startup.log', '/TASKS=startup'))
            Check "install with /TASKS=startup exit code 0" ($p.ExitCode -eq 0)
            $run = (Get-ItemProperty $runKey -Name 'Remotely' -ErrorAction SilentlyContinue).Remotely
            Check "startup entry equals what the app's own setting writes: [$run]" ($run -eq '"C:\Program Files\Remotely\Remotely.exe" --minimized')
            $p = RunWait $newClient ($silent + '/LOG=client-startup-keep.log')
            Check "a later upgrade without the task keeps the startup entry" ((Get-ItemProperty $runKey -Name 'Remotely' -ErrorAction SilentlyContinue).Remotely -eq $run)
            $null = RunWait 'C:\Program Files\Remotely\unins000.exe' ($silent + '/LOG=client-upgrade-uninstall.log')
            Check "uninstall removed the startup entry" ($null -eq (Get-ItemProperty $runKey -Name 'Remotely' -ErrorAction SilentlyContinue))
            Check "uninstall removed the service" (WaitFor 'ugone2' { (sc.exe query Remotely.Host) -match '1060' } 20)
            Check "uninstall kept the device key and the address book canary" ((Test-Path "$dataDir\host.key") -and (Test-Path "$appDir\address-book-canary.json"))
          }

          Write-Host "`n===== CLIENT INSTALLER: CURRENT USER (no service) ====="
          $args2 = $silent + @('/CURRENTUSER', '/LOG=client-install-user.log', "/Server=$server", "/Pin=$pin", "/Code=$(NewCode)", '/Name=inst-user-host', "/Trust=$viewerId")
          $p = RunWait (Get-ChildItem "$PWD\inst\Remotely-Setup-*.exe").FullName $args2
          Check "per-user installer exit code 0" ($p.ExitCode -eq 0)
          $userDir = Join-Path $env:LOCALAPPDATA 'Programs\Remotely'
          Check "per-user files in the user's profile" ((Test-Path "$userDir\Remotely.exe") -and (Test-Path "$userDir\Remotely.Host.exe"))
          Check "no service was created for the per-user install" ((sc.exe query Remotely.Host) -match '1060')
          Check "sign-in entry registered" ($null -ne (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'Remotely.Host' -ErrorAction SilentlyContinue))
          Check "user-mode host online" (WaitFor 'uonline' { ((& $probe list 2>&1) -join "`n") -match 'online\s+host\s+inst-user-host\s' } 40)
          $null = RunWait "$userDir\unins000.exe" ($silent + '/LOG=client-uninstall-user.log')
          Check "per-user uninstall removed the sign-in entry" ($null -eq (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'Remotely.Host' -ErrorAction SilentlyContinue))
          Check "per-user uninstall removed the program" (WaitFor 'ugone' { -not (Test-Path "$userDir\Remotely.Host.exe") } 20)

          Write-Host "`n===== SERVER UNINSTALL ====="
          $null = RunWait 'C:\Program Files\Remotely Server\unins000.exe' ($silent + '/LOG=server-uninstall.log')
          Check "server service removed" (WaitFor 'sgone' { (sc.exe query Remotely.Server) -match '1060' } 20)
          Check "firewall rule removed" (-not ((netsh advfirewall firewall show rule name="Remotely Server") -match 'Rule Name'))
          Check "server data kept" (Test-Path 'C:\ProgramData\Remotely Server\devices.json')

          Write-Host "`n===== SERVER UPGRADE: the v0.2.0 release installer, then this build ====="
          $newServer = "$PWD\inst\Remotely-Server-Setup-0.4.0-x64.exe"
          $sdata = 'C:\ProgramData\Remotely Server'
          if (Test-Path $sdata) { Remove-Item $sdata -Recurse -Force }
          $oldServer = GetRelease 'Remotely-Server-Setup-0.2.0-x64.exe'
          if ($oldServer) {
            $p = RunWait $oldServer ($silent + '/LOG=server-old-install.log')
            Check "v0.2.0 server installer exit code 0" ($p.ExitCode -eq 0)
            Check "v0.2.0 server is registered as version 0.2.0" ((ArpVersion $serverGuid) -eq '0.2.0')
            Check "v0.2.0 server service running" (WaitFor 'oldsrv' { (sc.exe query Remotely.Server) -match 'RUNNING' } 30)
            $oldPin = ((& $serverExe pin) | Select-Object -Last 1).Trim()
            Check "v0.2.0 server key pin printed (64 hex)" ($oldPin -match '^[0-9a-f]{64}$')
            Set-Content "$sdata\upgrade-canary.json" '{"canary":"server data that must survive an upgrade"}'
            $sCanary = (Get-FileHash "$sdata\upgrade-canary.json").Hash
            $sBefore = Snap 'C:\Program Files\Remotely Server'
            Write-Host "v0.2.0 server folder: $($sBefore.Count) files"

            Write-Host "--- failing server upgrade (/SimulateFailure=1): must roll back"
            $p = RunWait $newServer ($silent + @('/LOG=server-rollback.log', '/SimulateFailure=1'))
            Write-Host "failing installer exit code: $($p.ExitCode)"
            Check "a failing server upgrade reports failure (non-zero exit code)" ($p.ExitCode -ne 0)
            $sAfter = Snap 'C:\Program Files\Remotely Server'
            Check "server rollback: every file is exactly the v0.2.0 file again ($($sAfter.Count) vs $($sBefore.Count) files)" (SameSnap $sBefore $sAfter)
            Check "server rollback: Apps and features still says 0.2.0" ((ArpVersion $serverGuid) -eq '0.2.0')
            Check "server rollback: the old service is running again" (WaitFor 'rbsrv' { (sc.exe query Remotely.Server) -match 'RUNNING' } 40)
            Check "server rollback: the Server Manager of the failed upgrade is gone" (-not (Test-Path 'C:\Program Files\Remotely Server\Manager'))

            Write-Host "--- server upgrade"
            $p = RunWait $newServer ($silent + '/LOG=server-upgrade.log')
            Check "server upgrade exit code 0" ($p.ExitCode -eq 0)
            Check "server upgrade: Apps and features says 0.4.0" ((ArpVersion $serverGuid) -eq '0.4.0')
            Check "server upgrade: the service is running" (WaitFor 'upsrv' { (sc.exe query Remotely.Server) -match 'RUNNING' } 40)
            Check "server upgrade: the Server Manager is installed" (Test-Path 'C:\Program Files\Remotely Server\Manager\Remotely.ServerManager.exe')
            $newPin = ((& $serverExe pin) | Select-Object -Last 1).Trim()
            Check "server upgrade: the server key (pin) did not change" ($newPin -eq $oldPin)
            Check "server upgrade: the server data canary is untouched" ((Get-FileHash "$sdata\upgrade-canary.json").Hash -eq $sCanary)
            Check "server upgrade: the firewall rule is in place" ((netsh advfirewall firewall show rule name="Remotely Server") -match 'Remotely Server')
            $null = RunWait 'C:\Program Files\Remotely Server\unins000.exe' ($silent + '/LOG=server-upgrade-uninstall.log')
            Check "server uninstall removed the service and the Manager" ((WaitFor 'sgone2' { (sc.exe query Remotely.Server) -match '1060' } 20) -and (-not (Test-Path 'C:\Program Files\Remotely Server\Manager')))
            Check "server uninstall kept the data" (Test-Path "$sdata\upgrade-canary.json")
          }

          Write-Host "`nFAILED CHECKS: $script:fail"
          Get-ChildItem *.log | ForEach-Object { Write-Host "--- $($_.Name) (last 25 lines)"; Get-Content $_ -Tail 25 }
          if ($script:fail -gt 0) { exit 1 } else { exit 0 }   # without this the exit code of the last native command (sc.exe query on a removed service = 1060) leaks out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-smoke-${{ matrix.arch }}
          path: |
            *.log
            lan-selftest.txt
            frames-service
          if-no-files-found: ignore

  # One click: Actions > build > Run workflow > fill in "release_tag" (for example v0.4.0) to publish the installers as a DRAFT release.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [installers, installer-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "Installer-*", path: release, merge-multiple: true }
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          ls -la release
          gh release create "$TAG" release/*.exe --repo "$GITHUB_REPOSITORY" --draft --title "Remotely $TAG" \
            --notes "Installers for Windows 11 (x64 and ARM64) and the server. Unsigned: see docs/user-guide.md. The Mac .dmg is attached by the 'mac' workflow."
